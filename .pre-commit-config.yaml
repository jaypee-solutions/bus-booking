default_install_hook_types:
  - post-checkout
  - post-merge
  - post-rewrite
  - pre-push
default_stages:
  - manual
  - pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-docstring-first
      - id: check-merge-conflict
        args:
          - '--assume-in-merge'
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: name-tests-test
        args:
          # this project uses pytest's `test_*.py` convention, not the `*_test.py` default
          - '--pytest-test-first'
      - id: no-commit-to-branch
        stages:
          - pre-push
      - id: trailing-whitespace
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.285.0
    hooks:
      - id: renovate-config-validator
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.32
    hooks:
      # keep uv.lock in sync with pyproject.toml, including after history-changing operations:
      - id: uv-lock
        stages:
          - post-checkout
          - post-merge
          - post-rewrite
          - manual
          - pre-push
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args:
          - '--fix'
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: local
    hooks:
      # pyright and pytest run through `uv run` rather than in an isolated pre-commit venv,
      # because both need to resolve this project's own imports.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: false
        require_serial: true
      - id: pytest
        name: pytest
        entry: uv run pytest --cov
        language: system
        types:
          - python
        pass_filenames: false
        require_serial: true
      - id: forbidden-files
        name: forbidden files
        entry: found Copier update rejection files; review them and remove them
        language: fail
        files: \.rej$
